<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1c1b19">
    <meta name="description" content="Browse and download Minecraft skins shared by the Plushify community.">
    <link rel="icon" href="/Plushify/art/plushify-icon.png" type="image/png" sizes="32x32">
    <title>Skin gallery — Plushify</title>
    <script type="module" crossorigin src="/Plushify/assets/gallery-u9FcJH0S.js"></script>
    <link rel="modulepreload" crossorigin href="/Plushify/assets/navigation-DThHB9XZ.js">
    <link rel="modulepreload" crossorigin href="/Plushify/assets/gallery-api-L9uO-2DT.js">
    <link rel="stylesheet" crossorigin href="/Plushify/assets/navigation-nCN_6h8o.css">
  </head>
  <body>
    <a class="skip" href="#gallery">Skip to gallery</a>
    <header class="site-header">
      <div class="frame header-inner">
        <a class="wordmark" href="/Plushify/"><img src="/Plushify/art/plushify-icon.png" alt="" width="32" height="32"> Plushify</a>
        <button class="tool-button menu-toggle" type="button" id="menu-open" aria-haspopup="dialog" aria-controls="side-menu"><span class="menu-icon" aria-hidden="true"></span> Menu</button>
      </div>
    </header>
    <main class="frame gallery" id="gallery">
      <div class="hero">
        <div><h1>Skin gallery</h1><p class="gallery-intro">Download Minecraft skins shared by the Plushify community.</p></div>
        <a class="tool-button action-button" href="/Plushify/">Open creator</a>
      </div>
      <p id="gallery-message" class="gallery-message panel" role="status">Loading public skins…</p>
      <ul id="gallery-grid" class="gallery-grid" aria-label="Public skins" hidden></ul>
      <button id="gallery-more" class="tool-button action-button" type="button" hidden>Load more skins</button>
      <p class="gallery-policy"><a href="/Plushify/#sharing">Sharing settings</a> <span aria-hidden="true">·</span> <a href="/Plushify/privacy.html">Privacy and removal</a></p>
      <template id="gallery-card">
        <li class="gallery-card panel">
          <div class="skin-head" aria-hidden="true"></div>
          <a class="tool-button action-button"><span class="icon i-download" aria-hidden="true"></span> Download PNG</a>
        </li>
      </template>
    </main>
    <footer class="site-footer"><div class="frame footer-inner"><span>Plushify by N3TU</span><div><a href="/Plushify/privacy.html">Privacy</a><a href="/Plushify/license.html">Copyright &amp; license</a></div></div></footer>
  </body>
</html>
